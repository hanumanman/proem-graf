services:
  influxdb3-core:
    image: influxdb:3.11.2-core
    container_name: influxdb3-core
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
    volumes:
      - influxdb3-data:/var/lib/influxdb3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No healthcheck: minimal image ships no http client.
    # Collector retries with backoff by design, never crashes loop.

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    ports:
      # Loopback only. Public reach goes through the tunnel, never the LAN.
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      INFLUX_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN}
      # Public URL, so an idle browser tab should not keep a session alive for a week.
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 24h
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb3-core
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  collector:
    image: oven/bun:1.2
    container_name: proem-graf-collector
    working_dir: /app/collector
    volumes:
      - ./collector:/app/collector
    env_file:
      - .env
    environment:
      # Inside compose network, reach InfluxDB by service name.
      # `environment` wins over `env_file`.
      INFLUX_HOST: http://influxdb3-core:8181
      INFLUX_DATABASE: proemion
    entrypoint: ["sh", "-c", "bun install --frozen-lockfile && exec bun src/cli/main.ts"]
    depends_on:
      - influxdb3-core
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  influxdb3-data:
  grafana-data:
