apiVersion: 1

# Leave uid unset. Grafana 13.2.1 exits if this file sets a uid that is
# not already stored. Dashboard JSON binds to the generated uid
# PD260F78FC8D02CC3.
datasources:
  - name: InfluxDB-Proemion
    type: influxdb
    access: proxy
    url: http://influxdb3-core:8181
    jsonData:
      version: SQL
      dbName: proemion
      insecureGrpc: true
    secureJsonData:
      token: ${INFLUX_ADMIN_TOKEN}
